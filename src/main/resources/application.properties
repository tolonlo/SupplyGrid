spring.application.name=supplygrid

# Configuracion de la base de datos PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/supplygrid_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# E2-01: el esquema lo crea UNICAMENTE Flyway a partir de
# src/main/resources/db/migration/V1__esquema.sql (= modelo-fisico.sql).
# Hibernate ya NO crea ni modifica tablas: solo valida que las entidades
# coincidan con lo que Flyway ya creo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration