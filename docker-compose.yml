version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: supplygrid_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: supplygrid_db
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
